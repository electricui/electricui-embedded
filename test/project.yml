---
# Electric UI Embedded Library - Ceedling Unit test config
:project:
  :which_ceedling: gem
  :ceedling_version: "?"

  :use_exceptions: FALSE
  :use_deep_preprocessor: :none # options are :none, :mocks, :tests, or :all
  :use_backtrace: :none # options are :none, :simple, or :gdb
  :use_auxiliary_dependencies: TRUE

  # performance options. If your tools start giving mysterious errors, consider
  # dropping this to 1 to force single-tasking
  :test_threads: :auto
  :compile_threads: :auto

  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

:environment:

:extension:
  :executable: .out

:paths:
  :test:
    - test/**
  :include:
    - ../src/**
  :source:
    - ../src/**
  :libraries: []

:flags:
  :test:
    :compile:
      :*:
        - -fsanitize=address
        - -fsanitize=undefined
        - -g
    :link:
      :*:
        - -fsanitize=address
        - -fsanitize=undefined
:defines:
  :common: &common_defines
    - TEST
    - CMOCK_MEM_DYNAMIC
  :test:
    :*:
      - *common_defines
    :test_eui_serial_transport_encode_large:
      - *common_defines
      - PAYLOAD_SIZE_MAX=1023
    :test_eui_serial_transport_loopback_large:
      - *common_defines
      - PAYLOAD_SIZE_MAX=1023
  :test_preprocess:
    - *common_defines

:unity:
  :use_param_tests: TRUE

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  :enforce_strict_ordering: TRUE
  :plugins:
    - :ignore
    - :ignore_arg
    - :expect
    - :expect_any_args
    - :callback
  :c_calling_conventions:
    - CALLBACK
  :treat_as:
    uint8:    HEX8
    uint16:   HEX16
    uint32:   UINT32
    int8:     INT8
    bool:     UINT8

  :includes:
    - <stdint.h>

:gcov:
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
  :gcovr:
    :html_medium_threshold: 75
    :html_high_threshold: 90

# LIBRARIES
:libraries:
  :placement: :end
  :flag: "${1}"
  :common: &common_libraries []
  :test:
    - *common_libraries
  :release:
    - *common_libraries

:plugins:
  :load_paths: []
  :enabled:
    - report_tests_pretty_stdout
    - module_generator
    - gcov